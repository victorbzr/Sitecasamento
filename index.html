<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lista de presentes e confirmação de presença do brunch de casamento de Isabela e Victor, 12/12/2026.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Presentes Isabela & Victor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: papel de convite com lírios nos cantos; lista de presentes como cartões de papelaria; folha de pagamento sobe de baixo */
:root{
  --paper:#fbf9fc;
  --card:#ffffff;
  --ink:#3d3550;
  --muted:#7a7090;
  --lilac:#7e65ad;
  --lilac-soft:#ece5f6;
  --gold:#b69a6a;
  --line:#ddd3ea;
  --script:"Pinyon Script","Great Vibes",cursive;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.5;overflow-x:hidden}
.corner{position:absolute;pointer-events:none;mix-blend-mode:multiply;z-index:0}
.corner.tl{top:0;left:0;width:min(40vw,300px);-webkit-mask-image:radial-gradient(ellipse 100% 100% at 0 0,#000 55%,transparent 98%);mask-image:radial-gradient(ellipse 100% 100% at 0 0,#000 55%,transparent 98%)}
.corner.br{right:0;width:min(40vw,320px);bottom:0;-webkit-mask-image:radial-gradient(ellipse 100% 100% at 100% 100%,#000 55%,transparent 98%);mask-image:radial-gradient(ellipse 100% 100% at 100% 100%,#000 55%,transparent 98%)}
.page{position:relative;min-height:100%;overflow:hidden}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px calc(min(40vw,320px)*1.35)}

header{text-align:center;display:grid;gap:6px;justify-items:center;padding-top:clamp(140px,22vw,240px)}
.mono{font-family:var(--serif);color:var(--lilac);font-size:42px;letter-spacing:.08em;display:flex;align-items:center;gap:18px}
.mono span.bar{width:1px;height:44px;background:var(--line)}
.eyebrow{font-family:var(--sans);text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--muted)}
h1{font-family:var(--script);font-weight:400;color:var(--lilac);font-size:clamp(52px,12vw,96px);line-height:1.05;margin:4px 0 0;text-wrap:balance}
.sub{font-family:var(--sans);text-transform:uppercase;letter-spacing:.3em;font-size:14px;color:var(--lilac)}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold);margin:10px 0}
.orn::before,.orn::after{content:"";width:60px;height:1px;background:var(--gold);opacity:.6}
.intro{max-width:34em;margin:0 auto;font-size:20px;color:var(--ink);text-wrap:pretty}
.meta{font-family:var(--sans);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.how{margin:36px auto 8px;max-width:640px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.how div{display:grid;gap:2px;justify-items:center;font-size:16px;color:var(--muted)}
.how b{font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--lilac)}

.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:34px 0 22px}
.chip{font-family:var(--sans);font-size:13px;letter-spacing:.06em;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--lilac);border-color:var(--lilac);color:#fff}
.chip:focus-visible,.btn:focus-visible,.gift:focus-visible,.close:focus-visible,input:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.gift{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:22px 22px 18px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;position:relative;transition:transform .2s,box-shadow .2s}
.gift::after{content:"";position:absolute;inset:5px;border:1px solid var(--lilac-soft);border-radius:2px;pointer-events:none}
.gift:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(80,55,120,.35)}
.gift .tag{font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.gift h3{margin:0;font-weight:600;font-size:22px;line-height:1.2;text-wrap:balance}
.gift p{margin:0;color:var(--muted);font-size:17px;font-style:italic}
.gift .foot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--lilac-soft);padding-top:10px;margin-top:4px}
.price{font-family:var(--serif);font-size:26px;color:var(--lilac);font-variant-numeric:tabular-nums}
.cta{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}

.free{margin-top:28px;text-align:center;display:grid;gap:8px;justify-items:center}
.free .script{font-family:var(--script);font-size:40px;color:var(--lilac);line-height:1}

.viewtabs{display:grid;grid-template-columns:1fr 1fr;max-width:440px;margin:28px auto 26px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.viewtabs button{all:unset;text-align:center;padding:12px 8px;font-family:var(--sans);font-size:13px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.viewtabs button[aria-selected="true"]{background:var(--lilac);color:#fff}
.viewtabs button:focus-visible{outline:2px solid var(--lilac);outline-offset:-3px}
.giftintro{text-align:center}
.rsvp{max-width:520px;margin:0 auto;display:grid;gap:18px;justify-items:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:30px 22px;position:relative}
.rsvp::after{content:"";position:absolute;inset:5px;border:1px solid var(--lilac-soft);border-radius:2px;pointer-events:none}
.rsvp .script{font-family:var(--script);font-size:46px;color:var(--lilac);line-height:1}
.rsvp .intro{margin:0;font-size:19px}
.facts{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;width:100%}
.facts div{display:grid;gap:2px}
.facts dt{font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--lilac)}
.facts dd{margin:0;font-size:18px}
.rsvp .btn{position:relative;z-index:1;min-width:240px}
footer{text-align:center;margin-top:60px;color:var(--muted);font-style:italic;font-size:18px;max-width:28em;margin-inline:auto}

/* folha de pagamento */
.overlay{position:fixed;inset:0;background:rgba(45,35,65,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:26px max(20px,env(safe-area-inset-left,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));display:grid;gap:14px;position:relative;animation:up .28s ease-out}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:10px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.close{position:absolute;top:12px;right:14px;background:none;border:0;font-size:28px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px}
.sheet h2{margin:0;font-size:26px;font-weight:600;line-height:1.2;padding-right:30px}
.sheet .price{font-size:32px}
.amount{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:15px}
.amount input{font-family:var(--serif);font-size:24px;width:150px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.tabs button{all:unset;text-align:center;padding:10px;font-family:var(--sans);font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--lilac);color:#fff}
.qrbox{background:#fff;border:1px solid var(--line);padding:14px;border-radius:6px;justify-self:center;line-height:0}
.qrbox img,.qrbox canvas{width:200px;height:200px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px;word-break:break-all;max-height:84px;overflow-y:auto;user-select:all;color:var(--ink)}
.btn{all:unset;box-sizing:border-box;text-align:center;cursor:pointer;padding:14px 18px;border-radius:999px;background:var(--lilac);color:#fff;font-family:var(--sans);font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--lilac);border:1px solid var(--lilac)}
.note{font-size:16px;color:var(--muted);text-align:center;margin:0}
.warn{font-family:var(--sans);font-size:13px;background:var(--lilac-soft);color:var(--ink);padding:10px 12px;border-radius:6px}
.small{font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:.04em}

@media (max-width:520px){
  body{font-size:18px}
  .how{grid-template-columns:1fr;gap:14px}
  header{padding-top:140px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
